name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests examples/financial_ner/run_case_study.py examples/shiftguard
      - run: ruff format --check src tests examples/financial_ner/run_case_study.py examples/shiftguard
      - run: python -m unittest discover -s tests -v
      - run: python examples/financial_ner/run_case_study.py
      - run: python examples/shiftguard/run_case_study.py
      - run: python -m build
      - run: python -m twine check dist/*
